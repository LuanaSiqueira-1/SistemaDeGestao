<header class="topbar">
  <div class="brand" routerLink="/dashboard">
    <img
      src="/logo-concessionaria.jpeg"
      alt="Logo da Concessionária"
      class="brand-logo"
    />

    <div>
      <strong>Concessionária</strong>
      <span>Sistema de Gestão</span>
    </div>
  </div>

  <nav class="navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Início
    </a>

    <a
      routerLink="/veiculos/cadastro"
      routerLinkActive="active"
      class="nav-link"
    >
      Cadastrar veículo
    </a>

    <a
      routerLink="/veiculos"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Consultar veículos
    </a>

    <a
      routerLink="/clientes/cadastro"
      routerLinkActive="active"
      class="nav-link"
    >
      Cadastrar cliente
    </a>

    <a
      routerLink="/clientes"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Consultar clientes
    </a>

    <a
      routerLink="/vendas/cadastro"
      routerLinkActive="active"
      class="nav-link"
    >
      Registrar venda
    </a>

    <a
      routerLink="/vendas"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-link"
    >
      Consultar vendas
    </a>

    <a
      routerLink="/relatorios/vendas"
      routerLinkActive="active"
      class="nav-link"
    >
      Relatório de vendas
    </a>

    <a
      routerLink="/estoque"
      routerLinkActive="active"
      class="nav-link"
    >
      Estoque
    </a>

    <button
      type="button"
      class="logout-button"
      (click)="logout()"
    >
      Sair
    </button>
  </nav>
</header>
