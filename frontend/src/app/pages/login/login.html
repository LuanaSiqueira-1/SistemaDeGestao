<div class="login-page">
  <section class="login-card">
    <header class="login-header">
      <h1>Entrar</h1>
      <p>Acesse sua conta</p>
    </header>

    <form
      class="login-form"
      #formulario="ngForm"
      (ngSubmit)="entrar(formulario)"
      autocomplete="off"
    >
      <div class="form-group">
        <label for="email">E-mail</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
          email
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
          [disabled]="enviando"
        />
      </div>

      <p class="success-message" *ngIf="mensagemSucesso">
        {{ mensagemSucesso }}
      </p>

      <p class="error-message" *ngIf="mensagemErro">
        {{ mensagemErro }}
      </p>

      <button
        class="login-button"
        type="submit"
        [disabled]="enviando"
      >
        {{ enviando ? 'Entrando...' : 'Entrar' }}
      </button>

      <button
        class="logout-button"
        type="button"
        *ngIf="usuarioLogado"
        [disabled]="enviando"
        (click)="sair()"
      >
        Sair
      </button>
    </form>
  </section>
</div>
