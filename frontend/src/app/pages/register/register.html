<div class="register-page">
  <section class="register-card">
    <header class="register-header">
      <h1>Criar conta</h1>
      <p>Preencha os dados para se cadastrar</p>
    </header>

    <form
      class="register-form"
      #formulario="ngForm"
      (ngSubmit)="cadastrar(formulario)"
      autocomplete="off"
    >
      <div class="form-group">
        <label for="nome">Nome completo</label>

        <input
          id="nome"
          type="text"
          name="nome"
          [(ngModel)]="nome"
          placeholder="Digite seu nome"
          autocomplete="off"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
          autocomplete="off"
          required
          email
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>

        <input
          id="senha"
          type="password"
          name="senha"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          autocomplete="new-password"
          minlength="6"
          required
        />
      </div>

      <p
        class="success-message"
        *ngIf="mensagemSucesso"
      >
        {{ mensagemSucesso }}
      </p>

      <p
        class="error-message"
        *ngIf="mensagemErro"
      >
        {{ mensagemErro }}
      </p>

      <button
        class="register-button"
        type="submit"
        [disabled]="enviando"
      >
        {{
          enviando
            ? 'Cadastrando...'
            : 'Cadastrar'
        }}
      </button>
    </form>
  </section>
</div>
