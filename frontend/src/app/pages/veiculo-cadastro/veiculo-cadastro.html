<app-navbar></app-navbar>

<main class="veiculo-page">
  <section class="veiculo-card">

    <header class="veiculo-header">
      <span class="page-label">CADASTRO DE VEÍCULO</span>

      <h1>Cadastrar veículo</h1>

      <p>
        Preencha os dados abaixo para adicionar um novo veículo ao sistema.
      </p>
    </header>

    <form
      class="veiculo-form"
      #formulario="ngForm"
      (ngSubmit)="cadastrar(formulario)"
      autocomplete="off"
    >
      <div class="form-group">
        <label for="marca">Marca</label>

        <input
          id="marca"
          type="text"
          name="marca"
          [(ngModel)]="marca"
          placeholder="Ex.: Toyota"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="modelo">Modelo</label>

        <input
          id="modelo"
          type="text"
          name="modelo"
          [(ngModel)]="modelo"
          placeholder="Ex.: Corolla"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="ano">Ano</label>

        <input
          id="ano"
          type="number"
          name="ano"
          [(ngModel)]="ano"
          placeholder="Ex.: 2024"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="cor">Cor</label>

        <input
          id="cor"
          type="text"
          name="cor"
          [(ngModel)]="cor"
          placeholder="Ex.: Prata"
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="quilometragem">Quilometragem</label>

        <input
          id="quilometragem"
          type="number"
          name="quilometragem"
          [(ngModel)]="quilometragem"
          placeholder="Ex.: 15000"
          min="0"
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="preco">Preço</label>

        <input
          id="preco"
          type="number"
          name="preco"
          [(ngModel)]="preco"
          placeholder="Ex.: 129900"
          min="0.01"
          step="0.01"
          required
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="status">Status</label>

        <select
          id="status"
          name="status"
          [(ngModel)]="status"
          required
          [disabled]="enviando"
        >
          <option value="DISPONIVEL">Disponível</option>
          <option value="VENDIDO">Vendido</option>
          <option value="EM_MANUTENCAO">Em manutenção</option>
        </select>
      </div>

      <p class="error-message" *ngIf="mensagemErro">
        {{ mensagemErro }}
      </p>

      <p class="success-message" *ngIf="mensagemSucesso">
        {{ mensagemSucesso }}
      </p>

      <button
        class="submit-button"
        type="submit"
        [disabled]="enviando"
      >
        {{ enviando ? 'Cadastrando...' : 'Cadastrar veículo' }}
      </button>
    </form>

  </section>
</main>
