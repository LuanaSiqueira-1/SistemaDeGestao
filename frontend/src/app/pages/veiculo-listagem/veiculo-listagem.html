<app-navbar></app-navbar>

<main class="veiculo-page">
  <section class="veiculo-card">

    <header class="veiculo-header">
      <span class="page-label">CONSULTA DE VEÍCULOS</span>

      <h1>Veículos cadastrados</h1>

      <p>
        Consulte os veículos disponíveis no sistema.
      </p>
    </header>

    <p
      class="loading-message"
      *ngIf="carregando"
    >
      Carregando veículos...
    </p>

    <p
      class="error-message"
      *ngIf="mensagemErro"
    >
      {{ mensagemErro }}
    </p>

    <div
      class="empty-message"
      *ngIf="
        !carregando &&
        !mensagemErro &&
        veiculos.length === 0
      "
    >
      Nenhum veículo cadastrado.
    </div>

    <div
      class="veiculos-lista"
      *ngIf="
        !carregando &&
        !mensagemErro &&
        veiculos.length > 0
      "
    >
      <article
        class="veiculo-item"
        *ngFor="let veiculo of veiculos"
      >
        <div class="veiculo-info">

          <h2>
            {{ veiculo.marca }} {{ veiculo.modelo }}
          </h2>

          <div class="veiculo-detalhes">

            <p>
              <strong>Ano</strong>
              <span>{{ veiculo.ano }}</span>
            </p>

            <p>
              <strong>Preço</strong>
              <span>{{ veiculo.preco | currency:'BRL' }}</span>
            </p>

            <p>
              <strong>Status</strong>
              <span class="status">
                {{ veiculo.status }}
              </span>
            </p>

          </div>

        </div>
      </article>
    </div>

  </section>
</main>
