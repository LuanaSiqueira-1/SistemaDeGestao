name: Backend CI & SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-coverage:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: concessionaria_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DB_URL: jdbc:mysql://localhost:3306/concessionaria_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # O Sonar precisa do histórico completo do Git para analisar o código

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x backend/mvnw

      # Garante que o runner vai segurar a onda até o MySQL responder de verdade
      - name: Aguardar o MySQL ficar pronto
        run: |
          echo "Aguardando o MySQL subir na porta 3306..."
          until nc -z -v -w30 localhost 3306; do
            echo "Ainda aguardando o banco..."
            sleep 2
          done
          echo "MySQL pronto para conexões!"

      # Executa build, roda testes, gera relatório JaCoCo e envia tudo pro SonarCloud
      - name: Executar build, testes e análise do Sonar
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dspring.profiles.active=test \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=SEU_NOME_DE_ORGANIZACAO_AQUI \
            -Dsonar.projectKey=SEU_PROJECT_KEY_AQUI \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml